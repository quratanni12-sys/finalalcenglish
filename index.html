<style>
:root{
  --bg:#f7f7f3; --bg-2:#efeee8; --surface:#ffffff; --surface-2:#f4f3ee;
  --ink:#0d1117; --ink-2:#2b3240; --muted:#5a6272; --faint:#8b92a0;
  --line:rgba(13,17,23,.09); --line-2:rgba(13,17,23,.16);
  --brand:#0f766e; --brand-2:#14b8a6; --brand-soft:#e2f3f0;
  --violet:#6d28d9; --violet-soft:#efe8fd; --amber:#b45309; --amber-soft:#fdf0dd;
  --rose:#be123c; --rose-soft:#fde7ec; --green:#047857; --green-soft:#dcf5ea;
  --grad:linear-gradient(115deg,#0f766e 0%,#0e7490 35%,#4f46e5 70%,#7c3aed 100%);
  --grad-soft:linear-gradient(135deg,rgba(20,184,166,.14),rgba(124,58,237,.12));
  --shadow:0 1px 2px rgba(13,17,23,.04),0 12px 32px -12px rgba(13,17,23,.14);
  --shadow-lg:0 30px 70px -30px rgba(13,17,23,.35);
  --glass:rgba(247,247,243,.78);
  --r:20px; --r-sm:12px;
}
[data-theme="dark"]{
  --bg:#0a0d12; --bg-2:#0f141b; --surface:#121821; --surface-2:#18202b;
  --ink:#eef1f5; --ink-2:#cdd3dc; --muted:#98a1b0; --faint:#6b7483;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --brand:#2dd4bf; --brand-2:#5eead4; --brand-soft:rgba(45,212,191,.12);
  --violet:#a78bfa; --violet-soft:rgba(167,139,250,.13); --amber:#fbbf24; --amber-soft:rgba(251,191,36,.12);
  --rose:#fb7185; --rose-soft:rgba(251,113,133,.12); --green:#34d399; --green-soft:rgba(52,211,153,.12);
  --grad:linear-gradient(115deg,#2dd4bf 0%,#38bdf8 35%,#818cf8 70%,#c084fc 100%);
  --grad-soft:linear-gradient(135deg,rgba(45,212,191,.12),rgba(167,139,250,.12));
  --shadow:0 1px 2px rgba(0,0,0,.3),0 16px 40px -18px rgba(0,0,0,.7);
  --shadow-lg:0 30px 70px -30px rgba(0,0,0,.8);
  --glass:rgba(10,13,18,.72);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.65 Geist,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,select,textarea{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
::selection{background:var(--violet);color:#fff}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.serif{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;letter-spacing:-.01em}
.grad-t{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mono{font-family:"Geist Mono",monospace}
.ph{background:var(--amber-soft);color:var(--amber);padding:1px 6px;border-radius:6px;font-weight:500;white-space:nowrap;border:1px dashed color-mix(in srgb,var(--amber) 40%,transparent)}
.muted{color:var(--muted)}

/* bars */
.demo-bar{background:var(--ink);color:var(--bg);font-size:.78rem;text-align:center;padding:6px 16px}
.demo-bar b{background:var(--amber-soft);color:var(--amber);padding:0 6px;border-radius:5px;font-weight:600}
.promo{background:var(--grad);color:#fff;font-size:.86rem;text-align:center;padding:9px 16px;font-weight:500}
.promo a{text-decoration:underline;text-underline-offset:3px;margin-left:6px}

/* header */
header.site{position:sticky;top:0;z-index:60;background:var(--glass);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border-bottom:1px solid var(--line)}
.hdr{display:flex;align-items:center;gap:18px;height:70px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.12rem;letter-spacing:-.02em;white-space:nowrap}
.logo .mk{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;font-family:"Instrument Serif",serif;font-style:italic;font-size:22px;font-weight:400;box-shadow:0 8px 20px -8px var(--violet)}
.logo small{display:block;font-size:.66rem;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;line-height:1}
.menu{display:flex;gap:2px;flex:1;justify-content:center;align-self:stretch;margin:0;padding:0}
.menu>li{list-style:none;position:static;display:flex;align-items:center}
.menu>li>a,.menu>li>button{display:flex;align-items:center;gap:5px;padding:9px 13px;border-radius:10px;font-size:.92rem;font-weight:500;color:var(--ink-2);transition:background .2s,color .2s}
.menu>li>a:hover,.menu>li>button:hover,.menu>li.open>button,.menu>li>a.cur{background:var(--surface-2);color:var(--ink)}
.menu .chev{font-size:.62rem;opacity:.6;transition:transform .2s}
.menu li.open .chev{transform:rotate(180deg)}
.mega{position:absolute;left:0;right:0;top:100%;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow-lg);display:none;animation:drop .25s ease}
.menu li.open .mega{display:block}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}}
.mega-in{display:grid;grid-template-columns:repeat(4,1fr) 1.25fr;gap:28px;padding:30px 20px 34px;max-width:1200px;margin:0 auto}
.mega h6{font-family:"Geist Mono",monospace;font-size:.7rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:12px}
.mega a.ml{display:block;padding:7px 0;font-size:.93rem;color:var(--ink-2)}
.mega a.ml:hover{color:var(--violet)}
.mega a.ml small{display:block;color:var(--faint);font-size:.78rem}
.mfeat{border-radius:18px;padding:22px;background:var(--grad);color:#fff;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.mfeat::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12);right:-50px;bottom:-60px}
.mfeat small{opacity:.85;font-size:.78rem}
.mfeat b{font-size:1.15rem;line-height:1.3}
.mfeat span{margin-top:auto;background:rgba(255,255,255,.2);padding:8px 12px;border-radius:10px;font-size:.84rem;font-weight:600;align-self:flex-start;position:relative;z-index:1}
.hdr-r{display:flex;align-items:center;gap:8px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:15px;transition:.2s;position:relative}
.ib:hover{border-color:var(--line-2)}
.lang{position:relative}
.lang-pop{position:absolute;right:0;top:48px;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:8px;display:none;z-index:70}
.lang.open .lang-pop{display:block;animation:drop .2s}
.lang-pop div{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:10px;font-size:.9rem}
.lang-pop div.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.lang-pop div.off{color:var(--faint)}
.lang-pop small{font-size:.68rem;font-family:"Geist Mono",monospace}
.burger{display:none}

/* drawer */
.drawer{position:fixed;inset:0;z-index:80;background:var(--bg);transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:18px 20px 40px}
.drawer.open{transform:none}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.drawer details{border-bottom:1px solid var(--line)}
.drawer summary,.drawer .dl{display:flex;justify-content:space-between;padding:16px 4px;font-size:1.1rem;font-weight:600;list-style:none;cursor:pointer;border-bottom:1px solid var(--line)}
.drawer details summary{border:0}
.drawer summary::-webkit-details-marker{display:none}
.drawer details a{display:block;padding:9px 16px;color:var(--muted)}
.drawer details[open] summary span{transform:rotate(45deg)}
.drawer summary span{transition:.2s}
.drawer .btn{width:100%;justify-content:center;margin-top:20px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:14px;font-weight:600;font-size:.95rem;border:1px solid var(--line-2);background:var(--surface);transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn.pri{background:var(--grad);color:#fff;border:0;box-shadow:0 12px 28px -12px var(--violet)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:9px 15px;font-size:.86rem;border-radius:11px}
.btn.wa-b{background:#25d366;color:#06301a;border:0}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.lnk{color:var(--brand);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.lnk:hover{gap:10px}
.lnk,.lnk *{transition:gap .2s}

/* type */
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:"Geist Mono",monospace;font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:500}
.eyebrow::before{content:"";width:18px;height:1.5px;background:currentColor}
h1,h2,h3,h4{letter-spacing:-.03em;line-height:1.1;font-weight:700}
.h1{font-size:clamp(2.4rem,5.6vw,4.4rem);letter-spacing:-.045em;line-height:1.02}
.h2{font-size:clamp(1.8rem,3.6vw,2.8rem);letter-spacing:-.035em}
.h3{font-size:1.2rem;letter-spacing:-.02em}
.lead{font-size:clamp(1.02rem,1.6vw,1.2rem);color:var(--muted);max-width:640px}

/* chips/badges */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.t-brand{background:var(--brand-soft);color:var(--brand)}
.t-violet{background:var(--violet-soft);color:var(--violet)}
.t-amber{background:var(--amber-soft);color:var(--amber)}
.t-rose{background:var(--rose-soft);color:var(--rose)}
.t-green{background:var(--green-soft);color:var(--green)}

/* sections */
.sec{padding:84px 0}
.sec.tight{padding:56px 0}
.sec.alt{background:var(--bg-2)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;margin-bottom:38px;flex-wrap:wrap}
.sh>div{max-width:720px}
.sh h2{margin-top:12px}
.sh p{color:var(--muted);max-width:430px}
.sh.center{flex-direction:column;align-items:center;text-align:center}
.sh.center p{max-width:620px}

/* grids + cards */
.g{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .3s,border-color .3s,box-shadow .3s}
a.card:hover,.card.hov:hover{transform:translateY(-4px);border-color:var(--line-2);box-shadow:var(--shadow-lg)}
.card h3{margin-bottom:8px}
.card p{color:var(--muted);font-size:.94rem}
.card .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--grad-soft);border:1px solid var(--line);margin-bottom:18px}
.card .more{margin-top:16px;font-size:.88rem}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.card.flat{box-shadow:none}

/* hero home */
.hero{position:relative;padding:72px 0 90px;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 400px at 85% 20%,rgba(124,58,237,.16),transparent 70%),radial-gradient(600px 460px at 10% 0%,rgba(20,184,166,.18),transparent 70%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:26px 26px;mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 70%);pointer-events:none}
.hero-g{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center;position:relative;z-index:1}
.hero .h1{margin:22px 0 22px}
.pill{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:.84rem;color:var(--muted);box-shadow:var(--shadow)}
.pill b{background:var(--grad);color:#fff;padding:3px 10px;border-radius:999px;font-size:.74rem}
.live{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}70%{box-shadow:0 0 0 9px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.trust{display:flex;gap:22px;flex-wrap:wrap;margin-top:30px;font-size:.87rem;color:var(--muted)}
.trust span{display:flex;align-items:center;gap:8px}
.trust i{font-style:normal;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--green-soft);color:var(--green);font-size:.75rem}
.stack{position:relative;height:500px}
.fc{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow-lg);animation:bob 7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.fc.a{left:0;right:40px;top:30px;animation-delay:0s}
.fc.b{right:0;top:250px;width:250px;animation-delay:-2s}
.fc.c{left:10px;top:300px;width:230px;animation-delay:-4s;background:var(--grad);color:#fff;border:0}
.fc h5{font-size:.72rem;font-family:"Geist Mono",monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:500;margin-bottom:12px}
.fc.c h5{color:rgba(255,255,255,.8)}
.path{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.path span{padding:10px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:.9rem}
.path span.on{background:var(--grad);color:#fff;border:0}
.path em{font-style:normal;color:var(--faint)}
.lv{display:flex;gap:6px;margin-top:16px}
.lv span{flex:1;text-align:center;font-family:"Geist Mono",monospace;font-size:.76rem;padding:8px 0;border-radius:9px;background:var(--surface-2);color:var(--muted)}
.lv span.on{background:var(--ink);color:var(--bg)}
.prog{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;width:62%;background:var(--grad);border-radius:9px}
.big{font-size:1.9rem;font-weight:800;letter-spacing:-.04em;line-height:1.1}

/* marquee */
.marq{overflow:hidden;padding:26px 0;border-block:1px solid var(--line);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.marq .tr{display:flex;gap:34px;width:max-content;animation:mq 45s linear infinite}
.marq span{font-size:.95rem;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:10px}
.marq span b{font-size:1.4rem}
@keyframes mq{to{transform:translateX(-50%)}}

/* goals */
.goal{display:flex;flex-direction:column;min-height:260px}
.goal .n{font-family:"Instrument Serif",serif;font-style:italic;font-size:3rem;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.goal h3{margin:18px 0 8px;font-size:1.3rem}
.goal ul{list-style:none;margin:14px 0 18px;flex:1}
.goal li{font-size:.88rem;padding:6px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
.goal li:last-child{border:0}

/* flagship */
.flag{display:flex;flex-direction:column;min-height:340px}
.flag .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}
.flag .emo{font-size:40px}
.flag h3{font-size:1.5rem}
.flag .meta{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0;flex:1;align-content:flex-start}
.flag .meta span{font-size:.8rem;padding:6px 10px;border-radius:9px;background:var(--surface-2);color:var(--ink-2)}
.flag .foot{display:flex;justify-content:space-between;align-items:center;padding-top:18px;border-top:1px solid var(--line)}
.flag .price{font-size:.85rem;color:var(--muted)}
.flag .price b{font-size:1.1rem;color:var(--ink)}
.flag.hi{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flag.hi p,.flag.hi .price{color:color-mix(in srgb,var(--bg) 70%,transparent)}
.flag.hi .price b{color:var(--bg)}
.flag.hi .meta span{background:rgba(127,127,127,.18);color:var(--bg)}
.flag.hi .foot{border-color:rgba(127,127,127,.25)}

/* journey */
.jour{display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.jour::before{content:"";position:absolute;top:27px;left:12%;right:12%;height:2px;background:var(--grad);opacity:.4}
.js{text-align:center;padding:0 14px;position:relative}
.js .dot{width:56px;height:56px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-2);font-size:22px;position:relative;z-index:1;box-shadow:var(--shadow)}
.js h4{font-size:1.05rem;margin-bottom:6px}
.js p{font-size:.88rem;color:var(--muted)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--line);gap:1px}
.st{background:var(--surface);padding:28px 24px}
.st b{display:block;font-size:clamp(2rem,4vw,2.8rem);letter-spacing:-.045em;line-height:1;font-weight:800}
.st span{color:var(--muted);font-size:.88rem;display:block;margin-top:8px}

/* reviews */
.rev{display:flex;flex-direction:column}
.rev .stars{color:#f59e0b;letter-spacing:2px;font-size:.9rem}
.rev q{display:block;font-size:1.02rem;line-height:1.55;margin:14px 0 20px;flex:1;quotes:none;color:var(--ink-2)}
.rev .who{display:flex;align-items:center;gap:12px;padding-top:16px;border-top:1px solid var(--line)}
.av{width:42px;height:42px;border-radius:50%;background:var(--grad-soft);display:grid;place-items:center;font-size:20px;border:1px solid var(--line)}
.rev .who b{display:block;font-size:.92rem}
.rev .who small{color:var(--muted);font-size:.8rem}
.sample{position:absolute;top:14px;right:14px}

/* location */
.loc{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
.map{min-height:360px;border-radius:var(--r);border:1px solid var(--line);position:relative;overflow:hidden;background:
 linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/40px 40px,
 linear-gradient(var(--line) 1px,transparent 1px) 0 0/40px 40px,var(--surface-2)}
.map .road{position:absolute;background:var(--surface);border:1px solid var(--line-2)}
.map .pin{position:absolute;left:52%;top:46%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:6px}
.map .pin b{background:var(--ink);color:var(--bg);padding:8px 12px;border-radius:10px;font-size:.82rem;white-space:nowrap;box-shadow:var(--shadow-lg)}
.map .pin i{width:18px;height:18px;border-radius:50%;background:var(--grad);border:3px solid var(--surface);box-shadow:0 0 0 8px rgba(124,58,237,.18)}
.map .stn{position:absolute;font-size:.74rem;background:var(--surface);border:1px solid var(--line);padding:4px 9px;border-radius:8px;font-weight:600}
.transit div{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.transit div:last-child{border:0}
.transit .em{font-size:20px;width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center}
.transit b{display:block;font-size:.94rem}
.transit small{color:var(--muted)}

/* intakes */
.intk{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.intk .card{padding:20px}
.intk .d{font-size:2.4rem;font-weight:800;letter-spacing:-.05em;line-height:1}
.intk .m{font-family:"Geist Mono",monospace;font-size:.76rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.intk ul{list-style:none;margin-top:14px;font-size:.84rem;color:var(--ink-2)}
.intk li{padding:4px 0}
.intk li::before{content:"● ";color:var(--brand-2);font-size:.6rem;vertical-align:middle}

/* faq */
.faq details{border-bottom:1px solid var(--line)}
.faq summary{display:flex;justify-content:space-between;gap:20px;padding:20px 0;cursor:pointer;list-style:none;font-weight:600;font-size:1.02rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary i{font-style:normal;width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex:none;transition:transform .25s;font-size:.9rem}
.faq details[open] summary i{transform:rotate(45deg);background:var(--ink);color:var(--bg);border-color:var(--ink)}
.faq .a{padding:0 50px 22px 0;color:var(--muted)}
.faq-g{display:grid;grid-template-columns:.8fr 1.2fr;gap:50px}

/* cta band */
.cta{border-radius:30px;padding:64px 40px;text-align:center;position:relative;overflow:hidden;background:var(--ink);color:var(--bg)}
.cta::before{content:"";position:absolute;inset:0;background:radial-gradient(500px 300px at 20% 0%,rgba(20,184,166,.35),transparent 70%),radial-gradient(500px 300px at 90% 100%,rgba(124,58,237,.4),transparent 70%)}
.cta>*{position:relative}
.cta h2{font-size:clamp(2rem,4.6vw,3.4rem);letter-spacing:-.04em}
.cta p{opacity:.75;max-width:540px;margin:14px auto 28px}
.cta .btns{justify-content:center}
.cta .btn:not(.pri){background:transparent;color:var(--bg);border-color:rgba(127,127,127,.4)}

/* page hero */
.ph-hero{padding:44px 0 56px;position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.ph-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 320px at 90% 0%,rgba(124,58,237,.12),transparent 70%),radial-gradient(520px 320px at 0% 0%,rgba(20,184,166,.13),transparent 70%);pointer-events:none}
.ph-hero>.wrap{position:relative}
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--faint);margin-bottom:26px}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--ink)}
.crumbs span.sep{opacity:.5}
.ph-hero .h1{font-size:clamp(2.1rem,4.8vw,3.6rem);margin:16px 0 18px;max-width:880px}
.ph-hero .btns{margin-top:28px}
.phg{display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:start}

/* glance */
.glance{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);overflow:hidden}
.glance .gh{padding:16px 20px;background:var(--grad);color:#fff;font-weight:600;display:flex;justify-content:space-between;align-items:center;font-size:.92rem}
.glance dl{display:grid;grid-template-columns:1fr 1fr}
.glance dl div{padding:14px 20px;border-bottom:1px solid var(--line)}
.glance dl div:nth-child(odd){border-right:1px solid var(--line)}
.glance dt{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-family:"Geist Mono",monospace}
.glance dd{font-weight:600;font-size:.93rem;margin-top:3px}
.glance .gf{padding:16px 20px;display:flex;gap:8px}
.glance .gf .btn{flex:1;justify-content:center}

/* content blocks */
.split{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start}
.prose p{color:var(--ink-2);margin-bottom:16px;font-size:1.02rem}
.prose h2{font-size:1.7rem;margin:40px 0 14px}
.prose h3{font-size:1.25rem;margin:28px 0 10px}
.prose ul,.prose ol{margin:0 0 18px 22px;color:var(--ink-2)}
.prose li{margin-bottom:8px}
.prose a{color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.prose table{margin:10px 0 24px}
.checks{list-style:none}
.checks li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);color:var(--ink-2)}
.checks li:last-child{border:0}
.checks li::before{content:"✓";flex:none;width:24px;height:24px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-size:.78rem;font-weight:700;margin-top:1px}
.steps{counter-reset:s;display:grid;gap:14px}
.step{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.step::before{counter-increment:s;content:counter(s,decimal-leading-zero);font-family:"Geist Mono",monospace;font-weight:500;width:46px;height:46px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:.9rem}
.step h4{font-size:1.08rem;margin-bottom:4px}
.step p{color:var(--muted);font-size:.93rem}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:560px}
th,td{padding:14px 18px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:"Geist Mono",monospace;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:500;background:var(--surface-2)}
tr:last-child td{border:0}
td b{font-weight:600}
.note{font-size:.82rem;color:var(--faint);margin-top:12px}
.callout{border-radius:var(--r);padding:22px 24px;display:flex;gap:16px;align-items:flex-start;border:1px solid var(--line)}
.callout .ci{font-size:20px;flex:none}
.callout h4{font-size:1rem;margin-bottom:4px}
.callout p{font-size:.93rem;color:var(--ink-2)}
.callout.warn{background:var(--amber-soft)}
.callout.info{background:var(--brand-soft)}
.callout.stop{background:var(--rose-soft)}
.mods .card{padding:22px}
.mods .card .ic{width:40px;height:40px;font-size:18px;margin-bottom:14px}
.mods h4{font-size:1.02rem;margin-bottom:4px}
.tt td:first-child{font-family:"Geist Mono",monospace;font-size:.8rem;white-space:nowrap;color:var(--muted)}
.tt td.brk{color:var(--faint);font-style:italic}

/* forms */
.form{display:grid;gap:14px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--bg);transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:var(--violet);box-shadow:0 0 0 4px var(--violet-soft)}
.field textarea{min-height:110px;resize:vertical}
.ok{display:none;padding:16px;border-radius:14px;background:var(--green-soft);color:var(--green);font-weight:600;font-size:.92rem}
.ok.show{display:block;animation:drop .3s}

/* tabs/filters */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:28px}
.tabs button{padding:9px 16px;border-radius:999px;border:1px solid var(--line-2);font-size:.88rem;font-weight:500;transition:.2s;background:var(--surface)}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cc{display:flex;flex-direction:column}
.cc .cc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.cc .emo{font-size:30px}
.cc h3{font-size:1.2rem}
.cc p{flex:1}
.cc .cc-meta{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.cc .cc-meta b{color:var(--ink)}
.grp-h{display:flex;align-items:center;gap:14px;margin:44px 0 18px}
.grp-h:first-child{margin-top:0}
.grp-h h3{font-size:1.35rem}
.grp-h span{flex:1;height:1px;background:var(--line)}

/* test */
.quiz{max-width:760px;margin:0 auto}
.qbar{height:6px;border-radius:9px;background:var(--surface-2);overflow:hidden;margin-bottom:26px}
.qbar i{display:block;height:100%;background:var(--grad);transition:width .4s;width:0}
.qn{font-family:"Geist Mono",monospace;font-size:.78rem;color:var(--faint);margin-bottom:10px}
.qq{font-size:clamp(1.3rem,2.6vw,1.8rem);font-weight:700;letter-spacing:-.03em;line-height:1.25;margin-bottom:24px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{padding:18px 20px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface);text-align:left;font-weight:500;transition:.2s;display:flex;gap:14px;align-items:center}
.opts button:hover{border-color:var(--violet);transform:translateY(-2px);box-shadow:var(--shadow)}
.opts button i{font-style:normal;font-family:"Geist Mono",monospace;font-size:.78rem;width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.res{text-align:center}
.res .lvl{font-size:5rem;font-weight:800;letter-spacing:-.06em;line-height:1;margin:10px 0}
.cefr{display:flex;gap:6px;justify-content:center;margin:20px 0}
.cefr span{padding:8px 14px;border-radius:10px;background:var(--surface-2);font-family:"Geist Mono",monospace;font-size:.84rem;color:var(--muted)}
.cefr span.on{background:var(--grad);color:#fff}

/* calc */
.calc{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
.calc .sum{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:28px;position:sticky;top:90px}
.calc .sum .tot{font-size:2.8rem;font-weight:800;letter-spacing:-.05em;margin:6px 0 16px}
.calc .sum div.ln{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid rgba(127,127,127,.25);font-size:.9rem}
.calc .sum small{opacity:.6;font-size:.78rem;display:block;margin-top:14px}
input[type=range]{width:100%;accent-color:var(--violet)}
.chk{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:.93rem;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--violet)}
.chk span{flex:1}
.chk b{font-weight:600}

/* blog */
.post{display:flex;flex-direction:column;padding:0}
.post .thumb{height:160px;background:var(--grad);position:relative;display:grid;place-items:center;font-size:48px}
.post .thumb.b{background:linear-gradient(135deg,#0e7490,#14b8a6)}
.post .thumb.c{background:linear-gradient(135deg,#7c3aed,#db2777)}
.post .thumb.d{background:linear-gradient(135deg,#b45309,#f59e0b)}
.post .thumb.e{background:linear-gradient(135deg,#1e293b,#4f46e5)}
.post .pb{padding:22px;display:flex;flex-direction:column;flex:1}
.post h3{font-size:1.1rem;margin:10px 0 8px;line-height:1.3}
.post .pm{font-size:.78rem;color:var(--faint);margin-top:auto;padding-top:14px}
.article{max-width:760px;margin:0 auto}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;margin-bottom:34px}
.toc b{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;font-family:"Geist Mono",monospace;color:var(--faint);font-weight:500}
.toc ol{margin:10px 0 0 20px;color:var(--brand)}
.answer{border-left:3px solid var(--violet);background:var(--violet-soft);padding:18px 22px;border-radius:0 14px 14px 0;margin-bottom:28px;font-size:1.02rem}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:160px;gap:12px}
.gal div{border-radius:18px;display:flex;align-items:flex-end;padding:16px;color:#fff;font-weight:600;font-size:.92rem;position:relative;overflow:hidden}
.gal div span{position:absolute;top:14px;right:16px;font-size:34px}
.gal .w2{grid-column:span 2}.gal .h2r{grid-row:span 2}

/* sitemap page */
.smap{columns:3;column-gap:30px}
.smap div{break-inside:avoid;margin-bottom:26px}
.smap h4{font-size:.95rem;margin-bottom:8px}
.smap a{display:block;font-size:.9rem;color:var(--muted);padding:3px 0}
.smap a:hover{color:var(--brand)}

/* footer */
.site-foot{background:var(--ink);color:var(--bg);margin-top:0;padding:70px 0 30px}
.site-foot .fg{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:34px}
.site-foot h6{font-family:"Geist Mono",monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;opacity:.55;font-weight:500;margin-bottom:16px}
.site-foot a{display:block;padding:5px 0;font-size:.9rem;opacity:.8}
.site-foot a:hover{opacity:1}
.site-foot p{opacity:.7;font-size:.9rem}
.site-foot .logo .mk{box-shadow:none}
.site-foot .ph{background:rgba(251,191,36,.15);color:#fbbf24}
.fbot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:50px;padding-top:24px;border-top:1px solid rgba(127,127,127,.25);font-size:.8rem;opacity:.7}
.fbot a{display:inline;margin-left:16px}
.news{display:flex;gap:8px;margin-top:18px}
.news input{flex:1;padding:11px 14px;border-radius:11px;border:1px solid rgba(127,127,127,.3);background:rgba(127,127,127,.1);color:var(--bg);min-width:0}

/* whatsapp */
.wa{position:fixed;right:20px;bottom:20px;z-index:70}
.wa>button{width:60px;height:60px;border-radius:50%;background:#25d366;color:#fff;font-size:28px;display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(37,211,102,.7);transition:transform .2s}
.wa>button:hover{transform:scale(1.07)}
.wa-pop{position:absolute;right:0;bottom:74px;width:290px;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);overflow:hidden;display:none}
.wa.open .wa-pop{display:block;animation:drop .25s}
.wa-pop .wh{background:#075e54;color:#fff;padding:16px 18px}
.wa-pop .wh b{display:block}
.wa-pop .wh small{opacity:.8}
.wa-pop a{display:flex;justify-content:space-between;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);font-size:.9rem}
.wa-pop a:hover{background:var(--surface-2)}
.wa-pop a small{color:var(--muted)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:.88rem;z-index:90;transition:transform .35s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);max-width:calc(100% - 40px)}
.toast.show{transform:translate(-50%,0)}
.toast:empty{display:none}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* responsive */
@media (max-width:1060px){
  .menu,.hdr-r .hide-m{display:none}
  .burger{display:grid}
  .hdr{justify-content:space-between}
  .hero-g,.phg,.split,.loc,.calc,.faq-g{grid-template-columns:1fr}
  .stack{height:440px;max-width:520px}
  .g4,.intk{grid-template-columns:repeat(2,1fr)}
  .site-foot .fg{grid-template-columns:1fr 1fr}
  .site-foot .fg>div:first-child{grid-column:1/-1}
  .smap{columns:2}
  .calc .sum{position:static}
}
@media (max-width:720px){
  .g2,.g3,.g4,.intk,.opts{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr 1fr}
  .jour{grid-template-columns:1fr 1fr;row-gap:30px}
  .jour::before{display:none}
  .sec{padding:60px 0}
  .hero{padding:44px 0 60px}
  .stack{height:auto;display:grid;gap:12px}
  .fc{position:static;width:auto!important;animation:none}
  .form .row{grid-template-columns:1fr}
  .gal{grid-template-columns:1fr 1fr;grid-auto-rows:130px}
  .gal .w2{grid-column:span 2}
  .smap{columns:1}
  .cta{padding:48px 22px;border-radius:24px}
  .faq .a{padding-right:0}
  .glance dl{grid-template-columns:1fr}
  .glance dl div:nth-child(odd){border-right:0}
  .demo-bar{font-size:.72rem}
  .logo small{display:none}
}

/* ===== ALC brand logo & live maps ===== */
.logo-img{height:36px;width:auto;display:block}
.drawer .logo-img{height:32px}
[data-theme="dark"] .hdr .logo,[data-theme="dark"] .drawer .logo{background:#fff;padding:6px 10px;border-radius:12px}
.site-foot .foot-logo{display:inline-block;background:#fff;padding:14px 20px;border-radius:16px;opacity:1}
.foot-logo img{height:82px;width:auto;display:block}
.fcontact{margin-top:14px}
.fcontact p{font-size:.84rem;line-height:1.55;margin-bottom:10px}
.fcontact a{display:inline !important;padding:0 !important}
.map-live{background:var(--surface-2);min-height:380px}
.map-live iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:saturate(.9)}
[data-theme="dark"] .map-live iframe{filter:invert(.9) hue-rotate(180deg) saturate(.8)}
.loc-cards{grid-template-columns:1fr;gap:14px}
.transit .btns{flex-wrap:wrap;gap:8px}
@media (max-width:760px){.logo-img{height:30px}.map-live{min-height:300px}}

/* ===== Language switcher ===== */
.lang-btn{width:auto !important;padding:0 10px;gap:5px;display:inline-flex;align-items:center}
.lang-btn b{font-size:.72rem;font-weight:600;font-family:"Geist Mono",monospace}
.lang-pop .lopt,.dlang .lopt{display:flex;width:100%;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:10px;font-size:.9rem;background:none;border:0;color:var(--ink-2);cursor:pointer;text-align:start;font-family:inherit}
.lang-pop .lopt:hover,.dlang .lopt:hover{background:var(--surface-2);color:var(--ink)}
.lang-pop .lopt.on,.dlang .lopt.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.lang-note{font-size:.72rem;color:var(--faint);padding:8px 10px 4px;margin:0;border-top:1px solid var(--line);margin-top:6px}
.dlang{padding:4px 0 8px}
/* hide Google Translate chrome */
iframe.skiptranslate,.goog-te-banner-frame,#goog-gt-tt,.goog-te-balloon-frame,.VIpgJd-ZVi9od-ORHb-OEVmcd,.VIpgJd-ZVi9od-aZ2wEe-wOHMyf{display:none !important}
body{top:0 !important}
.goog-text-highlight{background:none !important;box-shadow:none !important}
font{background:none !important;box-shadow:none !important}
/* right-to-left (Arabic) */
[dir="rtl"] body{text-align:right}
[dir="rtl"] .lang-pop{right:auto;left:0}
[dir="rtl"] .checks li{padding-left:0}

/* ===== parent-site data additions ===== */
.tphoto{position:relative;width:96px;height:96px;margin:0 auto 16px;border-radius:50%;overflow:hidden;background:var(--grad);display:grid;place-items:center}
.tphoto span{color:#fff;font-weight:700;font-size:1.4rem}
.tphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.fsec{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--brand);margin:18px 0 6px;font-family:"Geist Mono",monospace;font-weight:500}
.fsoc a{display:inline !important;padding:0 !important}

.bankd{margin:12px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.bankd dt{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);margin-top:8px}
.bankd dt:first-child{margin-top:0}
.bankd dd{margin:2px 0 0;font-weight:600;color:var(--ink);overflow-wrap:anywhere}

/* ===== mobile: keep wide tables and columns inside the screen ===== */
.split>*,.g>*,.loc>*,.faq-g>*{min-width:0}
.tbl{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.article table{display:block;max-width:100%;overflow-x:auto}
.checks li{overflow-wrap:anywhere}
@media (max-width:600px){.article table{min-width:0;display:table;width:100%}.article th,.article td{padding:10px 8px}}

/* placeholders are no longer highlighted on the public site */
.ph,.site-foot .ph{background:none;border:0;padding:0;color:inherit;font-weight:inherit;white-space:normal}
.revsum{display:flex;gap:20px;align-items:center;margin-bottom:22px;padding:20px 24px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.revsum .big{font-size:3rem;line-height:1}
.revsum p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.rev .orig{margin-top:10px;font-size:.82rem;color:var(--muted)}
.rev .orig summary{cursor:pointer;color:var(--brand)}
.rev .orig p{margin:6px 0 0}

a[href^="mailto"]{overflow-wrap:anywhere;word-break:break-word}

</style>
</head>

function nextMondays(n){
  const out=[], d=new Date(); d.setHours(0,0,0,0);

const LANGS=[[`en`,`English`,`EN`],[`ar`,`العربية`,`AR`],[`zh-CN`,`中文`,`中文`],[`ru`,`Русский`,`RU`],[`id`,`Bahasa Indonesia`,`ID`],[`ko`,`한국어`,`KO`],[`ja`,`日本語`,`JA`],[`th`,`ไทย`,`TH`]];
function curLang(){const m=document.cookie.match(/(?:^|;\s*)googtrans=\/en\/([^;]+)/);const c=m?decodeURIComponent(m[1]):'en';return LANGS.some(l=>l[0]===c)?c:'en';}
function setLang(code){
  const exp=code==='en'?';expires=Thu, 01 Jan 1970 00:00:00 GMT':'';const v=code==='en'?'':`/en/${code}`;
  const host=location.hostname, parts=host.split('.');
  const doms=['',host?`;domain=${host}`:'',parts.length>2?`;domain=.${parts.slice(-2).join('.')}`:''];
  doms.forEach(d=>{document.cookie=`googtrans=${v};path=/${d}${exp}`;});
  try{localStorage.setItem('alc-lang',code);}catch(e){}
  location.reload();
}
function initLang(){
  const c=curLang();
  document.documentElement.lang=c==='zh-CN'?'zh':c;
  document.documentElement.dir=c==='ar'?'rtl':'ltr';
  if(c==='en')return;
  const box=document.createElement('div');box.id='gt';box.style.display='none';document.body.appendChild(box);
  window.gtInit=()=>{try{new google.translate.TranslateElement({pageLanguage:'en',includedLanguages:LANGS.map(l=>l[0]).join(','),autoDisplay:false},'gt');}catch(e){}};
  const s=document.createElement('script');s.src='https://translate.google.com/translate_a/element.js?cb=gtInit';s.async=true;
  s.onerror=()=>toast('Translation could not load. Please check your connection.');document.head.appendChild(s);
}
const langList=cls=>LANGS.map(([c,n,a])=>`<button type="button" class="${cls}${c===curLang()?' on':''}" data-lang="${c}" lang="${c}">${n}<small>${c===curLang()?'✓':a}</small></button>`).join('');

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3200);}

/* ===== BLOCKS ===== */
const sec = (inner,cls='')=>`<section class="sec ${cls}"><div class="wrap">${inner}</div></section>`;
const head = (e,h,p='',center=false)=>`<div class="sh ${center?'center':''} rv"><div><span class="eyebrow">${e}</span><h2 class="h2">${h}</h2></div>${p?`<p>${p}</p>`:''}</div>`;
const cards = (items,cols=3)=>`<div class="g g${cols}">${items.map(([i,t,p,to,tag])=>{
  const inner=`${tag?`<div class="tags">${tag}</div>`:''}${i?`<div class="ic">${i}</div>`:''}<h3 class="h3">${t}</h3><p>${p}</p>${to?`<div class="more lnk">Learn more <span>→</span></div>`:''}`;
  return to?`<a class="card rv" href="${L(to)}">${inner}</a>`:`<div class="card rv">${inner}</div>`;}).join('')}</div>`;
const steps = items=>`<div class="steps">${items.map(([t,p])=>`<div class="step rv"><div><h4>${t}</h4><p>${p}</p></div></div>`).join('')}</div>`;

const table = (h,rows,note='')=>`<div class="tbl rv"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${note?`<p class="note">${note}</p>`:''}`;
const faqList = items=>`<div class="faq">${items.map(([q,a],i)=>`<details ${i===0?'open':''}><summary>${q}<i>+</i></summary><div class="a">${a}</div></details>`).join('')}</div>`;
const faqSec = (items,title='Frequently asked questions')=>sec(`<div class="faq-g"><div class="rv"><span class="eyebrow">FAQ</span><h2 class="h2" style="margin-top:12px">${title}</h2><p class="muted" style="margin-top:14px">Can't find your answer? <a class="lnk" href="${L('/contact/')}">Talk to an advisor →</a></p></div><div class="rv">${faqList(items)}</div></div>`);
const callout = (k,t,p)=>`<div class="callout ${k} rv"><div class="ci">${k==='warn'?'⚠️':k==='stop'?'⛔':'ℹ️'}</div><div><h4>${t}</h4><p>${p}</p></div></div>`;
const cta = (h=`Find your level in <span class="serif">15 minutes.</span>`,p=`Take the free placement test, then talk to an advisor about the right course and start date for you.`)=>sec(`<div class="cta rv"><h2>${h}</h2><p>${p}</p><div class="btns"><a class="btn pri" href="${L('/placement-test/')}">Take the free test →</a><a class="btn" href="${WA(CAMPUSES[0])}" target="_blank" rel="noopener">💬 Chat on WhatsApp</a></div></div>`,'tight');
const btnsDefault = `<a class="btn pri" href="${L('/placement-test/')}">Take the free placement test →</a><a class="btn" href="${L('/apply/')}">Apply now</a>`;

function crumbs(path){
  const parts=path.split('/').filter(Boolean); let acc='/'; const out=[`<a href="#/">Home</a>`];
  parts.forEach((p,i)=>{acc+=p+'/'; const r=R[acc]; const name=r?r.t:p.replace(/-/g,' ');
    out.push(`<span class="sep">/</span>`); out.push(i===parts.length-1||!r?`<span>${name}</span>`:`<a href="${L(acc)}">${name}</a>`);});
  return `<nav class="crumbs" aria-label="Breadcrumb">${out.join('')}</nav>`;
}
const hero = (path,e,h1,lead,btns=btnsDefault,aside='')=>`<div class="ph-hero"><div class="wrap">${crumbs(path)}<div class="${aside?'phg':''}"><div><span class="eyebrow">${e}</span><h1 class="h1">${h1}</h1><p class="lead">${lead}</p>${btns?`<div class="btns">${btns}</div>`:''}</div>${aside}</div></div></div>`;
const hubLinks = paths=>cards(paths.map(p=>{const r=R[p];return [r.i||'→',r.t,r.d,p];}));

/* ===== COURSE PAGE ===== */
function courseCard(c){
  return `<a class="card cc rv" href="${L(cPath(c))}"><div class="cc-top"><span class="emo">${c.i}</span>${c.b?`<span class="tag ${c.b==='Flagship'?'t-violet':c.b==='Local'?'t-brand':'t-amber'}">${c.b}</span>`:''}</div><h3>${c.n}</h3><p class="muted" style="font-size:.92rem;margin-top:6px">${c.tag}</p><div class="cc-meta"><span>${c.gl[0]} · ${c.gl[1]}</span><b>${c.gl[5].replace('From ','')}</b></div></a>`;
}
function renderCourse(c){
  const p=cPath(c);
  const glance=`<aside class="glance rv"><div class="gh"><span>At a glance</span><span class="tag" style="background:rgba(255,255,255,.2);color:#fff">${GROUPS[c.g].n}</span></div><dl>${GL.map((k,i)=>`<div><dt>${k}</dt><dd>${c.gl[i]}</dd></div>`).join('')}<div><dt>Certificate</dt><dd>Yes, CEFR-mapped</dd></div></dl><div class="gf"><a class="btn pri sm" href="${L('/apply/')}">Apply</a><a class="btn sm" href="${L('/placement-test/')}">Free test</a></div></aside>`;
  let h = hero(p,`${c.i} ${GROUPS[c.g].n}`,c.n,c.tag,btnsDefault,glance);
  h += sec(`<div class="split"><div class="rv"><span class="eyebrow">Overview</span><h2 class="h2" style="margin:12px 0 18px">About this course</h2><div class="prose"><p>${c.intro}</p></div>${c.note?callout(...c.note):''}</div><div class="rv"><h3 class="h3" style="margin-bottom:10px">Who it's for</h3>${checks(c.who)}</div></div>`);
  h += sec(head(`What you'll study`,`Course <span class="serif grad-t">modules</span>`,`Every module is taught by qualified teachers and mapped to the CEFR.`)+`<div class="g g3 mods">${c.mod.map(([i,t,d])=>`<div class="card rv"><div class="ic">${i}</div><h4>${t}</h4><p>${d}</p></div>`).join('')}</div>`,'alt');
  h += sec(`<div class="split"><div class="rv"><span class="eyebrow">Outcomes</span><h2 class="h2" style="margin:12px 0 18px">By the end, you will…</h2>${checks(c.out)}</div><div class="rv"><span class="eyebrow">What's included</span><h2 class="h2" style="margin:12px 0 18px">Fees & inclusions</h2><div class="card flat"><div class="big grad-t">${c.gl[5]}</div><p style="margin:6px 0 14px">${c.rate?`Multi-month discounts available. <a class="lnk" href="${L('/fees/')}">Calculate your total →</a>`:`<a class="lnk" href="${L('/fees/')}">See all fees →</a>`}</p>${checks([`Free placement test and level check`,`Course materials and online practice platform`,`Progress reports every 4 weeks`,`Certificate of completion`,`Student support and weekly activities`])}</div></div></div>`);
  if(TT[c.tt]) h += sec(head(`Schedule`,`Sample timetable`,`Exact class times are confirmed on your first day.`)+`<div class="tt">${table(TT[c.tt].h,TT[c.tt].r.map(r=>r.map(x=>x===''?'':x)))}</div>`,'alt tight');
  if(c.kids) h += sec(head(`Focused courses`,`Target one skill`,`Short evening courses that sit alongside the full IELTS programme.`)+`<div class="g g3">${c.kids.map(s=>courseCard(C(s))).join('')}</div>`);
  h += sec(`<div class="split"><div class="rv"><span class="eyebrow">Entry requirements</span><h2 class="h2" style="margin:12px 0 18px">Is this course right for you?</h2><div class="prose"><p>Level needed: <b>${c.gl[2]}</b>. Take our free 15-minute placement test and we'll confirm the right class. If you're not ready yet, we'll recommend a course that gets you there.</p></div><div class="btns" style="margin-top:10px"><a class="btn dark" href="${L('/placement-test/')}">Check my level →</a></div>${c.gl[6].includes('*')?`<p class="note" style="margin-top:18px">${VISA_NOTE}</p>`:''}</div><div class="rv"><span class="eyebrow">Your next step</span><h2 class="h2" style="margin:12px 0 18px">Progression path</h2><div class="path" style="margin-bottom:18px"><span class="on">${c.sh}</span>${c.next.map(s=>`<em>→</em><span>${C(s).sh}</span>`).join('')}</div>${c.next.map(s=>{const n=C(s);return `<a class="card flat hov" style="display:flex;gap:14px;align-items:center;padding:16px 18px;margin-bottom:10px" href="${L(cPath(n))}"><span style="font-size:24px">${n.i}</span><span style="flex:1"><b>${n.n}</b><br><small class="muted">${n.gl[2]} · ${n.gl[5]}</small></span><span class="lnk">→</span></a>`;}).join('')}</div></div>`);
  h += faqSec(c.faq, `${c.sh}: common questions`);
  h += cta();
  return h;
}

/* ===== FORMS: every form is emailed to the ACE inbox, clearly labelled as coming from ALC English ===== */
const FORM_TO=`info@acelanguagecentre.edu.my`;
function formData(f){
  const kind=f.dataset.form||'Enquiry';
  const d={_subject:`[ALC English] ${kind} — new enquiry from the ALC English website`,_template:'table',_captcha:'false',
    'Source':'⚠️ This email was sent from the ALC English website — not from acelanguagecentre.edu.my. Please reply to this student as ALC English.',
    'Brand':'ALC English','Form':kind,'Page':location.href,'Website language':curLang(),'Sent':new Date().toLocaleString('en-GB',{timeZone:'Asia/Kuala_Lumpur'})+' (Malaysia time)'};
  f.querySelectorAll('.field').forEach(fd=>{const l=fd.querySelector('label'),i=fd.querySelector('input,select,textarea');if(l&&i&&i.value)d[l.textContent.trim()]=i.value;});
  f.querySelectorAll('input[type=email]').forEach(i=>{if(i.value){d._replyto=i.value;if(!d.Email)d.Email=i.value;}});
  const lvl=document.querySelector('.res .lvl');if(kind==='Placement test result'&&lvl)d['Placement test level']=lvl.textContent.trim();
  const hp=f.querySelector('input[name=_honey]');d._honey=hp?hp.value:'';
  return d;
}
async function sendForm(f){
  const btn=f.querySelector('button[type=submit]'),txt=btn?btn.innerHTML:'';
  if(f._busy)return;f._busy=true;if(btn){btn.disabled=true;btn.innerHTML='Sending…';}
  try{
    const r=await fetch(`https://formsubmit.co/ajax/${FORM_TO}`,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(formData(f))});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||String(j.success)==='false')throw new Error(j.message||'send failed');
    const ok=f.querySelector('.ok');if(ok)ok.classList.add('show');
    toast('Thanks! Your message has been sent to the ALC English team.');
    f.querySelectorAll('input,textarea').forEach(i=>{if(i.type!=='checkbox'&&i.type!=='hidden')i.value='';});
  }catch(e){
    toast(`Sorry, it didn't send. Please WhatsApp us or email ${FORM_TO}.`);
  }finally{f._busy=false;if(btn){btn.disabled=false;btn.innerHTML=txt;}}
}
function wireForms(root=document){
  root.querySelectorAll('form[data-demo]').forEach(f=>{
    if(f._wired)return;f._wired=true;
    if(!f.querySelector('input[name=_honey]'))f.insertAdjacentHTML('afterbegin','<input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">');
    f.addEventListener('submit',e=>{e.preventDefault();sendForm(f);});
  });
}

page('/about/',{t:`About`,i:`🏫`,d:`About ALC English, an English language centre in Kuala Lumpur.`,
r:()=>hero('/about/',`About us`,`Clear progress. <span class="serif grad-t">Real confidence.</span>`,`ALC English is a language centre in central Kuala Lumpur helping international and Malaysian learners reach their goals in English, from their first sentence to their first lecture at university.`,'')+
sec(`<div class="split"><div class="rv prose"><span class="eyebrow">Our story</span><h2 class="h2" style="margin:12px 0 18px">Why we started</h2><p>ALC English is part of the ACE Language Centre family, operated by ${COMPANY} (${SSM}) and teaching English in Kuala Lumpur since 2019. More than 8,000 students from 100+ countries have studied with us at our Mont Kiara and USJ Taipan campuses.</p><p>We believe every student should know where they are, where they're going and how long it will take. That's why every ALC course is mapped to the CEFR, with progress tests every four weeks and honest advice about the next step.</p></div><div class="rv">${cards([[`🎯`,`Mission`,`Help every learner reach the English level their future needs.`],[`📏`,`Honesty`,`Clear levels, clear fees and clear advice, with no false promises.`],[`🌍`,`Community`,`A friendly, multicultural campus where everyone speaks English.`]],1)}</div></div>`)+
sec(`<div class="card rv" style="max-width:860px;margin:0 auto"><span class="eyebrow">Message from our Founder & CEO</span><div class="prose" style="margin-top:14px"><p>“When we opened our first classrooms in 2019, I made one promise to every parent and student who trusted us: English will be the bridge to your dreams, never the barrier in front of them.</p><p>I have watched a young man from Yemen arrive unable to order lunch, and leave nine months later with a university offer in his hand. I have watched a mother from Saudi Arabia walk into our ladies-only class convinced it was too late for her — and graduate speaking with the confidence of a leader. Those transformations never stop humbling me.</p><p>To the students still deciding: your ambitions are safe with us. Come visit our campuses, meet our teachers, sit in a real class.”</p></div><div class="who" style="display:flex;gap:12px;align-items:center;margin-top:16px"><span class="av" style="width:48px;height:48px;font-weight:700">HS</span><span><b>Mr. Haroon Shahzad</b><br><small class="muted">Founder & Chief Executive Officer · ${COMPANY} · Est. 2019</small></span></div></div>`,'alt')+sec(head(`Learn more`,`Get to know <span class="serif grad-t">ALC</span>`)+hubLinks(['/about/our-teachers/','/about/licensing-accreditation/','/about/campus/']),'alt')+cta()});

const FAQS={
 [`Courses & levels`]:[[`How do I know which course is right for me?`,`Take the free placement test. We'll recommend a course based on your level and your goal.`],[`How many students are in a class?`,`A maximum of 12 in every adult class and 8 in Kids & Teens English, so teachers correct you in every session.`],[`Do I get a certificate?`,`Yes. Every student receives a certificate with a CEFR-mapped level.`],[`Can I change course after I start?`,`Yes, subject to your level and availability, usually at the start of a week.`]],
 [`Visa & arrival`]:[[`Which courses can support a Student Pass?`,`Only the Intensive English Programme, for applicants aged 18–35. The pass covers the enrolled student only.`],[`How long does the visa take?`,`About 31 days on average, with a 98% approval rate. Allow 4–6 weeks, plus time for any entry visa.`],[`Can I work while I study?`,`No. Language-centre Student Pass holders are not permitted to work in Malaysia.`],[`Do you offer airport pickup?`,`Yes, from KLIA and KLIA2 for RM 500, day or night, booked with your enrolment.`]],

legal('/privacy-policy/',`Privacy Policy`,`PDPA 2010`,`<p><b>Last updated:</b> 20 September 2026</p><h2>1. Who we are</h2><p>ALC English is a brand of ${COMPANY} (${SSM}), which also operates ACE Language Centre. This policy explains how we handle information collected through this website, enquiries, placement tests and student applications, in line with Malaysia's Personal Data Protection Act 2010 (PDPA).</p><h2>2. Information we collect</h2><p>We collect the details you submit, such as your name, email address, phone number with country code, course interest and messages. For formal Student Pass applications we may also receive documents such as passport copies, photographs and academic records.</p><h2>3. How we use information</h2><p>We use information to respond to enquiries, assess course suitability, process applications, provide student services, meet legal and regulatory obligations, and improve our website. We do not sell personal information.</p><h2>4. Sharing and storage</h2><p>Information is shared only with trusted service providers (including the form service that delivers website messages to our inbox) or authorities when needed to deliver services, process a student application, comply with law, or with your consent. We use reasonable technical and organisational safeguards and keep information only as long as necessary.</p><h2>5. Your choices</h2><p>You may ask to access or correct your data, or withdraw consent for marketing communications, subject to applicable legal obligations. Contact <a href="mailto:${EMAIL}">${EMAIL}</a> for privacy requests.</p>`);
legal('/terms/',`Terms & Conditions`,`Terms`,`<p><b>Last updated:</b> 20 September 2026</p><h2>1. Website information</h2><p>We aim to keep course information, schedules and fees accurate. Availability, class times, entry requirements and visa requirements can change; we confirm the applicable details in writing before enrolment.</p><h2>2. Enquiries and applications</h2><p>Submitting an enquiry, placement test or application does not guarantee admission, a visa, a course place or a particular outcome. Applicants must provide complete and accurate information and documents.</p><h2>3. Student responsibilities</h2><p>Students must comply with our academic and campus requirements, the Student Code of Conduct, applicable Malaysian laws and any agreed enrolment documentation. Student Pass eligibility and immigration decisions are made by the relevant authorities.</p><h2>4. Intellectual property</h2><p>Website content, branding, photographs and learning materials may not be copied, republished or used commercially without our written permission.</p><h2>5. Operator & contact</h2><p>ALC English is a brand of ${COMPANY} (${SSM}). Questions about these terms can be sent to <a href="mailto:${EMAIL}">${EMAIL}</a>.</p>`);
legal('/refund-policy/',`Cancellation & Refund Policy`,`Refunds`,`<p><b>Last updated:</b> 20 September 2026</p><h2>1. Requesting a review</h2><p>Send cancellation or refund requests in writing to <a href="mailto:${EMAIL}">${EMAIL}</a> with the student's full name, course, payment reference and the reason for the request.</p><h2>2. How requests are assessed</h2><p>Each request is reviewed against the signed enrolment agreement, the course start date, services already delivered and any third-party or regulatory charges. Visa, EMGS, bank and application charges may be subject to separate rules and may not be refundable once incurred.</p><h2>3. Timing and records</h2><p>We acknowledge every request and give the outcome, or ask for any further information needed, in writing. Approved refunds are returned through the appropriate payment channel after the required checks.</p><h2>4. Visa bond</h2><p>The personal bond required by Immigration with a Student Pass is fully refundable when you complete your studies or withdraw in good standing.</p><h2>5. Important</h2><p>This summary does not replace the cancellation and refund terms in your signed student agreement.</p>`);

const ART={
"most-popular-english-courses-malaysia-2026":`<div class="answer"><b>Quick answer:</b> In 2026, the most popular English courses in Malaysia for international students are Intensive General English, IELTS Preparation, Academic English, University Pathway English and English Speaking courses. The strongest combination is Intensive English → IELTS → University Pathway.</div>
<div class="toc"><b>In this guide</b><ol><li>Intensive English Programme</li><li>IELTS Preparation</li><li>Academic English</li><li>University Pathway English</li><li>Speaking & Communication</li><li>Business English, TOEFL & short camps</li><li>Which course should you choose?</li></ol></div>
<h2>1. Intensive English Programme</h2><p>Intensive English is the most popular choice for students who want fast, structured improvement. Full-time programmes usually run 20–30 hours a week and cover speaking, listening, reading, writing, grammar and vocabulary, with a placement test to find your starting level.</p><p>It suits students who have just arrived in Malaysia, anyone preparing for university without an IELTS score, and learners who want full immersion. <a href="${L('/courses/intensive-english/')}">See ALC's Intensive English Programme</a>.</p>
<h2>2. IELTS Preparation</h2><p>IELTS is often needed for university admission, scholarships, professional registration and study abroad. Good IELTS courses include all four papers, band-improvement plans, weekly mock tests and individual feedback on writing and speaking.</p><p>Students also look for focused help: <a href="${L('/courses/ielts-preparation/ielts-speaking/')}">IELTS Speaking</a>, <a href="${L('/courses/ielts-preparation/ielts-writing/')}">IELTS Writing</a> and <a href="${L('/courses/ielts-preparation/ielts-for-university-admission/')}">IELTS for university admission</a>.</p>
<h2>3. Academic English</h2><p>University English is different from everyday English. Academic English teaches essay structure, paraphrasing, referencing, lecture note-taking and seminar skills. <a href="${L('/courses/academic-english/')}">Academic English at ALC</a>.</p>
<h2>4. University Pathway English</h2><p>Pathway programmes connect language learning with a clear academic future. Some Malaysian providers state that a recognised intensive English level may meet partner-university requirements without IELTS, depending on the institution and programme. <b>Always check acceptance directly with your chosen university.</b> <a href="${L('/courses/university-pathway-english/')}">University Pathway English</a>.</p>
<h2>5. English Speaking & Communication</h2><p>Many students have good grammar but lack speaking confidence. Conversation courses focus on fluency, pronunciation and real-life situations, from shopping and housing to campus life. <a href="${L('/courses/english-speaking-course/')}">Speaking course</a>.</p>
<h2>6. Business English, TOEFL & short camps</h2><ul><li><b>Business English</b>: emails, meetings, presentations and interviews for students and young professionals.</li><li><b>TOEFL preparation</b>: for students whose university or destination accepts TOEFL iBT.</li><li><b>Short-term camps</b>: English plus activities for holiday students and young learners.</li></ul>

"can-language-students-work-in-malaysia":`<div class="answer"><b>Quick answer:</b> No. International students holding a Student Pass to study at a language centre in Malaysia are not permitted to work. Work permission for students applies only to Student Pass holders at public universities and private higher education institutions, under set conditions.</div>
<h2>What the rules say</h2><p>Malaysia's Immigration Department allows limited part-time work only for Student Pass holders at public universities (UA) and private higher education institutions (IPTS). Language centres, training centres and skills centres are <b>not</b> included.</p><h2>What this means for you</h2><ul><li>Plan to fund your full course and living costs before you arrive.</li><li>Don't accept informal work; it can put your Student Pass at risk.</li><li>If you later move to a university programme, check the work conditions that apply then.</li></ul><h2>How to plan your budget</h2><p>Many students budget RM 2,000–3,500 per month for living costs in KL. See our <a href="${L('/international-students/cost-of-living-kuala-lumpur/')}">cost of living guide</a> and use the <a href="${L('/fees/')}">fee calculator</a> to estimate course costs.</p><p class="note">Rules can change. Check the Immigration Department of Malaysia and EMGS for current guidance.</p>`};
